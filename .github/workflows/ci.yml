name: CI

# GitHub — зеркало GitLab (ADR 0006 в my-ops): тесты здесь второй контур, но
# запускаются из тех же файлов, что и job test в .gitlab-ci.yml. AppImage пока
# собирается только здесь (release-appimage.yml → ci.yml): по тегу v*, на
# событие release и вручную.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: |
          set -eu
          for project in tests/*/*.Tests.csproj; do
            name=$(basename "$project" .csproj)
            dotnet test "$project" -c Release \
              --logger "junit;LogFilePath=${GITHUB_WORKSPACE}/artifacts/test-results/$name.xml"
          done

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/*.xml
          if-no-files-found: warn

  appimage:
    needs: test
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install packaging dependencies
        run: ./packaging/appimage/install-deps-ubuntu.sh

      - name: Build AppImage
        env:
          RAW_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          APPIMAGE_VERSION="${RAW_VERSION#v}"
          # workflow_dispatch without a tag → CI build id
          if [[ "$APPIMAGE_VERSION" == "main" || "$APPIMAGE_VERSION" == "master" || -z "$APPIMAGE_VERSION" ]]; then
            APPIMAGE_VERSION="0.0.0-ci.${{ github.run_number }}"
          fi
          export APPIMAGE_VERSION
          export OUTPUT_NAME="WireguardGui-${APPIMAGE_VERSION}-x86_64.AppImage"
          ./packaging/appimage/build-appimage.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WireguardGui-x86_64.AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Attach AppImage to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
