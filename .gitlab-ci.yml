# GitLab — основной контур: код и тесты живут здесь.
# GitHub — зеркало (push mirror из настроек проекта) и второй контур:
# .github/workflows/ci.yml гоняет те же тесты и собирает AppImage. Тесты в обоих
# контурах одни и те же — tests/*/*.Tests.csproj, .NET 8.

stages:
  - test

# MR-пайплайн нужен ради отчёта о тестах: junit из job'а test показывается во
# вкладке «Tests» и в самом MR. Ветка по умолчанию и тег — обычный пайплайн.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_IMAGE: mcr.microsoft.com/dotnet/sdk:8.0

# Тестовых проектов три (App, Application, Infrastructure) — у каждого свой отчёт,
# иначе логгер JunitXml перезаписывает файл предыдущего проекта. Все отчёты едут
# артефактами и попадают во вкладку «Tests» пайплайна и в MR.
test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - |
      set -eu
      for project in tests/*/*.Tests.csproj; do
        name=$(basename "$project" .csproj)
        dotnet test "$project" -c Release --logger "junit;LogFilePath=$CI_PROJECT_DIR/artifacts/test-results/$name.xml"
      done
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/test-results/*.xml
    reports:
      junit: artifacts/test-results/*.xml
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
